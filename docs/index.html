<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMH Flights">
<title>CMH Flight Deals</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#0b5cff;--gn:#12805c;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#f3f4f6;--mu:#9ca3af;--ac:#5b8cff;--gn:#3ddc97;--bd:#262c36}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 16px 4px}h1{margin:0;font-size:22px}.up{color:var(--mu);font-size:13px}
nav{display:flex;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top);background:var(--bg)}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.opt{padding:0 16px 8px;color:var(--mu);font-size:14px}
main{padding:0 16px 24px;display:grid;gap:10px;max-width:640px;margin:auto}
a.c{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.n{font-weight:600}.p{font-size:22px;font-weight:700;color:var(--ac)}.m{color:var(--mu);font-size:13px;margin-top:4px}
.dn{color:var(--gn);font-size:13px;font-weight:600}svg{color:var(--mu)}.e{color:var(--mu);text-align:center;padding:32px 0}
</style></head><body>
<header><h1>✈ Flights from <span id="o">CMH</span></h1><div class="up" id="u">Loading…</div></header>
<nav><button data-t="domestic" class="on">Domestic</button><button data-t="international">International</button><button data-t="deals">Deals</button></nav>
<div class="opt" id="opt"><label><input type="checkbox" id="nd"> Nonstop only</label></div>
<main id="l"></main>
<script>
const $=s=>document.querySelector(s);let D,tab='domestic';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=i=>{const m=(Date.now()-new Date(i))/6e4;return m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const spark=h=>{if(h.length<2)return'';const a=Math.min(...h),b=Math.max(...h),r=b-a||1;return `<svg viewBox="0 0 60 20" width="60" height="20"><polyline points="${h.map((v,i)=>`${i*60/(h.length-1)},${18-(v-a)/r*16}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`};
function render(){
  $('#o').textContent=D.origin;$('#u').textContent='Updated '+ago(D.updated)+'. Fares can be cached, so confirm before booking.';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#opt').style.display=tab==='deals'?'none':'';
  let h='';
  if(tab==='deals'){h=D.posts.map(p=>`<a class="c" href="${esc(p.link)}"><div class="n">${esc(p.title)}</div><div class="m">${p.kind==='card'?'Card offer · ':''}${esc(p.source)} · ${ago(p.seen_at)}</div></a>`).join('')||'<div class="e">No error fares or sales for your airports right now.</div>'}
  else{h=D.deals.filter(d=>d.bucket===tab&&(!$('#nd').checked||!d.stops)).map(d=>`<a class="c" href="${esc(d.link||'#')}"><div class="r"><div class="n">${esc(d.name)}</div><div class="p">$${Math.round(d.price)}</div></div><div class="r"><div class="m">${esc(d.dates)}${d.dates?' · ':''}${d.stops?d.stops+' stop':'nonstop'}${d.airline?' · '+esc(d.airline):''} · ${esc(d.source)}</div>${spark(d.hist)}</div><div class="m">≈ ${d.ur.toLocaleString()} Chase UR · ${d.mr.toLocaleString()} Amex MR</div>${d.prev&&d.price<d.prev?`<div class="dn">↓ down from $${Math.round(d.prev)}</div>`:''}</a>`).join('')||'<div class="e">Nothing here yet.</div>'}
  $('#l').innerHTML=h;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#nd').onchange=()=>render();
fetch('deals.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;render()}).catch(()=>{$('#u').textContent='No data yet. Run the workflow once, then reload.'});
</script></body></html>
