<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMH Flights">
<title>CMH Flight Deals</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--tx:#111114;--mu:#74747d;--ln:#e9e9ec;--ac:#111114;--ac2:#fff;--gn:#0b8a52;--gb:rgba(11,138,82,.1);--rd:#d33;--chip:#ececef}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--card:#141417;--tx:#f4f4f5;--mu:#8e8e98;--ln:#232328;--ac:#f4f4f5;--ac2:#09090b;--gn:#3ddc97;--gb:rgba(61,220,151,.12);--rd:#ff7a7a;--chip:#1d1d22}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 18px 0;border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-1.2px;line-height:1}h1 span{color:var(--mu);font-weight:500}
.up{color:var(--mu);font-size:12.5px;margin-top:6px}
#rf{border:1px solid var(--ln);background:var(--card);border-radius:50%;width:36px;height:36px;font-size:17px;line-height:1}
.tabs{display:flex;gap:22px;margin-top:12px}
.tabs button{border:0;background:none;color:var(--mu);font-weight:600;font-size:15px;padding:8px 0 10px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--tx)}
.wrap{max-width:660px;margin:auto;padding:12px 14px 40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--tx);appearance:none;-webkit-appearance:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ac2)}
select.chip{padding-right:13px}
#fp{display:none;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#fp.open{display:grid}#fp label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}#fp .full{grid-column:1/-1}
#fp input[type=date],#fp select{display:block;width:100%;max-width:100%;height:40px;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:0 10px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=range]{width:100%;accent-color:var(--tx)}
.note{font-size:12.5px;color:var(--mu);margin:2px 4px 10px}
#l{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.c{position:relative;display:block;padding:15px 16px;border-top:1px solid var(--ln);cursor:pointer;color:inherit;text-decoration:none}
.c:first-child{border-top:0}.c:active{background:var(--bg)}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.n{font-weight:650;font-size:17px;letter-spacing:-.3px}
.p{font-size:24px;font-weight:750;letter-spacing:-1px;text-align:right}.p.g{color:var(--gn)}
.m{color:var(--mu);font-size:13px;margin-top:3px}.pt{color:var(--mu);font-size:12px;text-align:right;margin-top:2px}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--gb);color:var(--gn)}.b.w{background:rgba(221,51,51,.12);color:var(--rd)}.b.i{background:var(--chip);color:var(--tx)}
.st{border:0;background:none;color:var(--mu);font-size:18px;padding:0 8px 0 0;line-height:1}.st.on{color:#f5a524}
.nm{display:flex;align-items:center}svg.sp{color:var(--mu);flex:none;margin-right:10px}
.e{color:var(--mu);text-align:center;padding:44px 16px;font-size:14.5px}
/* calendar screen */
#sh{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#sh.open{transform:none;visibility:visible}
.sh1{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:1px solid var(--ln);background:var(--bg)}
.x{border:1px solid var(--ln);background:var(--card);width:36px;height:36px;border-radius:50%;font-size:16px}
.sh1 b{font-size:18px;letter-spacing:-.3px;display:block}.sh1 small{color:var(--mu);font-size:12.5px}
.q{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln)}.q::-webkit-scrollbar{display:none}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 10px;color:var(--mu);font-size:11px;text-align:center;border-bottom:1px solid var(--ln)}
#cg{flex:1;overflow:auto;padding:0 10px 150px;max-width:660px;width:100%;margin:auto}
.mt{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:22px 4px 8px}
.g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.d{height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:0;font-family:inherit;color:var(--tx);padding:0;position:relative}
.d i{font-style:normal;font-size:13px;font-weight:600}.d em{font-style:normal;font-size:11px;color:var(--mu);font-weight:500}
.d.cheap em{color:var(--gn);font-weight:750}.d.no{color:var(--mu);opacity:.4;pointer-events:none}.d.o{opacity:.25}
.d.in{background:var(--chip)}.d.s,.d.rt{background:var(--ac);color:var(--ac2);border-radius:12px}.d.s em,.d.rt em,.d.s.cheap em{color:var(--ac2);opacity:.85}
.bar{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px)}
.bar .in2{max-width:660px;margin:auto;display:flex;align-items:center;gap:14px}
.bar .p{font-size:28px}.bar .m{margin:0}.bar>.in2>div:first-child{flex:1}
.bk{background:var(--ac);color:var(--ac2);text-decoration:none;border-radius:14px;padding:14px 22px;font-weight:700;font-size:15px}
.bar .pt{text-align:left;margin-top:3px}
</style></head><body>
<div class="top"><div class="hd"><div><h1><span id="o">CMH</span> <span>→ anywhere</span></h1><div class="up" id="u">Loading…</div></div><button id="rf" aria-label="Refresh">↻</button></div>
<div class="tabs" id="tabs"><button data-t="domestic">Domestic</button><button data-t="international">International</button><button data-t="deals">Deals</button></div></div>
<div class="wrap">
<div id="ctl">
<div class="chips"><select class="chip" id="so"><option value="cheap">Cheapest</option><option value="deal">Best deal</option><option value="soon">Soonest</option></select><button class="chip" id="fb">Dates &amp; budget</button><button class="chip" id="cw">Weekends</button><button class="chip" id="cn">Nonstop</button><button class="chip" id="cs">★ Saved</button></div>
<div id="fp">
<div><label>Leave on or after</label><input type="date" id="df"></div><div><label>Leave on or before</label><input type="date" id="dt"></div>
<div><label>Trip at least</label><select id="l1"><option value="">any</option></select></div><div><label>Trip at most</label><select id="l2"><option value="">any</option></select></div>
<div class="full"><label id="bl">Budget</label><input type="range" id="bg" min="0" max="100" step="10"></div>
<div class="full"><button class="chip" id="rs">Reset filters</button></div>
</div>
<div class="note" id="nt"></div>
</div>
<div id="l"></div>
</div>
<div id="sh"></div>
<script>
const $=s=>document.querySelector(s),AV='https://www.aviasales.com',UR=1.25,MR=1.0; // cents per point, matches the script
const st={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={tab:st.get('tab','domestic'),sort:'cheap',nd:false,wk:false,sv:false,from:'',to:'',l1:'',l2:'',bg:null};
let D,saved=new Set(st.get('saved',[]));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=s=>new Date(s+'T00:00:00'),$$=s=>[...document.querySelectorAll(s)];
const fd=s=>s?dt(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const fdl=s=>s?dt(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'';
const dd=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const ago=i=>{const m=(Date.now()-new Date(i))/6e4;return m<2?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
const spark=h=>{if(h.length<2)return'';const a=Math.min(...h),b=Math.max(...h),r=b-a||1;return `<svg class="sp" viewBox="0 0 44 16" width="44" height="16"><polyline points="${h.map((v,i)=>`${(i*44/(h.length-1)).toFixed(1)},${(14-(v-a)/r*12).toFixed(1)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const pts=p=>`${Math.round(p*100/UR).toLocaleString()} UR · ${Math.round(p*100/MR).toLocaleString()} MR`;
function entries(d){
  const o=[],m=(d.dates||'').match(/(\d{4}-\d\d-\d\d)(?: to (\d{4}-\d\d-\d\d))?/),dep=d.dep||(m&&m[1])||'',ret=d.ret||(m&&m[2])||'';
  o.push({dep,ret,price:d.price,stops:d.stops,link:d.link});
  for(const c of d.cal||[])o.push({dep:c[0],ret:c[1],price:c[2],stops:c[3],link:c[4]?AV+c[4]:d.link});
  return o;
}
const dateFilters=()=>S.from||S.to||S.l1||S.l2||S.wk;
function ok(e){
  if(S.nd&&e.stops)return false;
  if(dateFilters()&&!e.dep)return false;
  if(S.from&&e.dep<S.from)return false;if(S.to&&e.dep>S.to)return false;
  if(S.l1||S.l2){if(!e.ret)return false;const n=dd(e.dep,e.ret);if(S.l1&&n<+S.l1)return false;if(S.l2&&n>+S.l2)return false}
  if(S.wk){if(![5,6].includes(dt(e.dep).getDay()))return false;if(e.ret&&![0,1].includes(dt(e.ret).getDay()))return false}
  return true;
}
function view(d){
  const ms=entries(d).filter(ok);if(!ms.length)return null;
  const e=ms.reduce((a,b)=>b.price<a.price?b:a);
  const prices=(d.cal||[]).map(c=>c[2]),h=d.hist||[],ref=prices.length>=5?med(prices):h.length>=3?med(h.slice(0,-1)):(d.prev||e.price);
  return {d,e,ref,score:e.price/(ref||e.price)};
}
function render(){
  $('#o').textContent=D.origin;$('#u').textContent='Updated '+ago(D.updated)+' · fares are cached, confirm before booking';
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const deals=S.tab==='deals';$('#ctl').style.display=deals?'none':'';
  if(deals){$('#l').innerHTML=D.posts.map(p=>`<a class="c" href="${esc(p.link)}"><div class="n" style="font-size:15.5px;line-height:1.3">${esc(p.title)}</div><div class="m">${p.kind==='card'?'Card offer':'Deal'} · ${esc(p.source)} · ${ago(p.seen_at)}</div></a>`).join('')||'<div class="e">No error fares or sales for your airports right now.<br>This list updates every 6 hours.</div>';return}
  const pool=D.deals.filter(d=>d.bucket===S.tab);
  const mx=Math.max(50,Math.ceil(Math.max(0,...pool.map(d=>d.price))/50)*50),bg=$('#bg');
  bg.max=mx;if(S.bg==null||S.bg>mx)S.bg=mx;bg.value=S.bg;$('#bl').textContent=S.bg>=mx?'Budget: no limit':'Budget: up to $'+S.bg;
  let v=pool.map(view).filter(Boolean).filter(x=>x.e.price<=S.bg&&(!S.sv||saved.has(x.d.key)));
  const cmp={cheap:(a,b)=>a.e.price-b.e.price,deal:(a,b)=>a.score-b.score,soon:(a,b)=>(a.e.dep||'9').localeCompare(b.e.dep||'9')||a.e.price-b.e.price}[S.sort];
  v.sort((a,b)=>(saved.has(b.d.key)-saved.has(a.d.key))||cmp(a,b));
  const nf=[S.from,S.to,S.l1,S.l2,S.bg<mx,S.wk].filter(Boolean).length;$('#fb').textContent='Dates & budget'+(nf?` · ${nf}`:'');
  $('#fb').classList.toggle('on',!!nf);
  $('#nt').textContent=dateFilters()?'Showing the cheapest fare that fits your dates. Open a city for its full calendar.':'';
  $('#cw').classList.toggle('on',S.wk);$('#cn').classList.toggle('on',S.nd);$('#cs').classList.toggle('on',S.sv);
  $('#l').innerHTML=v.map(({d,e,ref})=>{
    const badges=[],pc=ref?Math.round((1-e.price/ref)*100):0,h=d.hist||[];
    if(ref&&e.price<=ref*.45&&(d.cal||[]).length+h.length>=5)badges.push('<span class="b w">Possible error fare</span>');
    else if(pc>=25)badges.push(`<span class="b">${pc}% below usual</span>`);
    if(h.length>=4&&d.price<=Math.min(...h.slice(0,-1)))badges.push('<span class="b i">30-day low</span>');
    if(d.prev&&d.price<d.prev)badges.push(`<span class="b i">↓ from $${Math.round(d.prev)}</span>`);
    const when=e.dep?fd(e.dep)+(e.ret?' – '+fd(e.ret):''):esc(d.dates);
    return `<div class="c" data-k="${esc(d.key)}"><div class="r"><div><div class="nm"><button class="st${saved.has(d.key)?' on':''}" data-s="${esc(d.key)}" aria-label="Save">${saved.has(d.key)?'★':'☆'}</button><div class="n">${esc(d.name)}</div></div>
<div class="m">${when} · ${e.stops?e.stops+' stop':'nonstop'}${d.airline?' · '+esc(d.airline):''}</div></div>
<div style="flex:none"><div><div class="p${pc>=25?' g':''}">$${Math.round(e.price)}</div><div class="pt">${pts(e.price)}</div></div></div></div>
${(d.cal||[]).length||badges.length?`<div class="bd">${(d.cal||[]).length?'<span class="b i">Price calendar ›</span>':''}${badges.join('')}</div>`:''}</div>`}).join('')||`<div class="e">Nothing matches.<br>Try widening the dates or budget.</div>`;
}
/* full-screen calendar */
let sel,cur;
function openSheet(k){
  const d=D.deals.find(x=>x.key===k);if(!d)return;cur=d;
  const all=entries(d),cal=(d.cal||[]).map(c=>({dep:c[0],ret:c[1],price:c[2],stops:c[3],link:c[4]?AV+c[4]:d.link}));
  const map={};for(const e of cal.length?cal:all.slice(0,1))if(e.dep&&(!map[e.dep]||e.price<map[e.dep].price))map[e.dep]=e;
  if(all[0].dep&&!map[all[0].dep])map[all[0].dep]=all[0];
  cur.map=map;const keys=Object.keys(map).sort();
  const m=entries(d).filter(ok).sort((a,b)=>a.price-b.price)[0]||all[0];sel=m&&m.dep&&map[m.dep]?map[m.dep]:map[keys[0]]||all[0];
  const ps=Object.values(map).map(e=>e.price),lo=Math.min(...ps),hi=Math.max(...ps),thr=lo+(hi-lo)*.2;
  const months=[...new Set(keys.map(x=>x.slice(0,7)))];
  let g='';
  for(const mo of months){const [y,mm]=mo.split('-').map(Number),first=new Date(y,mm-1,1).getDay(),n=new Date(y,mm,0).getDate();
    g+=`<div class="mt">${dt(mo+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div><div class="g">`+'<div></div>'.repeat(first);
    for(let i=1;i<=n;i++){const key=`${mo}-${String(i).padStart(2,'0')}`,e=map[key];
      g+=e?`<button class="d${e.price<=thr&&hi>lo?' cheap':''}${dateFilters()&&!ok(e)?' o':''}" id="c${key}" data-d="${key}"><i>${i}</i><em>$${Math.round(e.price)}</em></button>`:`<div class="d no" id="c${key}"><i>${i}</i></div>`}
    g+='</div>'}
  const top=Object.values(map).sort((a,b)=>a.price-b.price).slice(0,4);
  $('#sh').innerHTML=`<div class="sh1"><button class="x" id="cl" aria-label="Close">✕</button><div><b>${esc(d.name)}</b><small>${esc(D.origin)} → ${esc(d.name)} · cheapest fare per departure day</small></div></div>
${Object.keys(map).length>1?`<div class="q">${top.map(e=>`<button class="chip" data-d="${e.dep}">${fd(e.dep)} · $${Math.round(e.price)}</button>`).join('')}</div>`:''}
<div class="dow">${'SMTWTFS'.split('').map(x=>`<span>${x}</span>`).join('')}</div>
<div id="cg">${(d.cal||[]).length?g:'<div class="note" style="margin:20px 6px">A full calendar is built for the cheapest destinations on each tab. This city only has its single best fare so far.</div>'+g}</div>
<div class="bar"><div class="in2"><div id="sm"></div><a class="bk" id="bk" href="#">Book ↗</a></div></div>`;
  paint();$('#sh').classList.add('open');document.body.style.overflow='hidden';
  const s=$('#c'+sel.dep);if(s)setTimeout(()=>s.scrollIntoView({block:'center'}),60);
}
function paint(){
  const dep=sel.dep,ret=sel.ret;
  $$('#cg .d').forEach(c=>{const k=c.id.slice(1);c.classList.toggle('s',k===dep);c.classList.toggle('rt',!!ret&&k===ret);c.classList.toggle('in',!!ret&&k>dep&&k<ret)});
  $('#sm').innerHTML=`<div class="p" style="text-align:left">$${Math.round(sel.price)}</div><div class="m">${sel.dep?fdl(sel.dep)+(sel.ret?' → '+fdl(sel.ret)+' · '+dd(sel.dep,sel.ret)+' nights':' · one way'):esc(cur.dates)} · ${sel.stops?sel.stops+' stop':'nonstop'}</div><div class="pt">≈ ${pts(sel.price)}</div>`;
  $('#bk').href=sel.link||'#';
}
const closeSheet=()=>{$('#sh').classList.remove('open');document.body.style.overflow=''};
$('#sh').onclick=e=>{if(e.target.closest('#cl')){closeSheet();return}const b=e.target.closest('[data-d]');if(b&&cur.map[b.dataset.d]){sel=cur.map[b.dataset.d];paint();const s=$('#c'+sel.dep);if(s&&b.classList.contains('chip'))s.scrollIntoView({block:'center',behavior:'smooth'})}};
/* events */
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.t;S.bg=null;st.set('tab',S.tab);render();scrollTo(0,0)};
$('#so').onchange=e=>{S.sort=e.target.value;render()};
$('#fb').onclick=()=>$('#fp').classList.toggle('open');
$('#cw').onclick=()=>{S.wk=!S.wk;render()};$('#cn').onclick=()=>{S.nd=!S.nd;render()};$('#cs').onclick=()=>{S.sv=!S.sv;render()};
$('#df').onchange=e=>{S.from=e.target.value;render()};$('#dt').onchange=e=>{S.to=e.target.value;render()};
$('#l1').onchange=e=>{S.l1=e.target.value;render()};$('#l2').onchange=e=>{S.l2=e.target.value;render()};
$('#bg').oninput=e=>{S.bg=+e.target.value;render()};
$('#rs').onclick=()=>{Object.assign(S,{from:'',to:'',l1:'',l2:'',bg:null,wk:false});['#df','#dt','#l1','#l2'].forEach(i=>$(i).value='');render()};
$('#rf').onclick=()=>load();
$('#l').onclick=e=>{const s=e.target.closest('[data-s]');if(s){const k=s.dataset.s;saved.has(k)?saved.delete(k):saved.add(k);st.set('saved',[...saved]);render();return}
  const c=e.target.closest('.c[data-k]');if(c)openSheet(c.dataset.k)};
for(let i=1;i
