<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMH Flights">
<title>CMH Flights</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0d1324;--mu:#6b7280;--ln:#e7e9ee;--ac:#3355ff;--acs:#eef1ff;--gn:#0e9f6e;--gns:#e6f6ef;--rd:#e11d48;--rds:#fde8ee;--sh:0 1px 2px rgba(13,19,36,.05),0 6px 20px rgba(13,19,36,.06);--tab:rgba(255,255,255,.88)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#151922;--tx:#f3f4f6;--mu:#9aa3b2;--ln:#242a37;--ac:#7088ff;--acs:#1c2342;--gn:#34d399;--gns:#10291f;--rd:#fb7185;--rds:#331520;--sh:0 1px 2px rgba(0,0,0,.4);--tab:rgba(21,25,34,.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom) + 76px)}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
.hdr{padding:calc(env(safe-area-inset-top) + 18px) 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hdr h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.8px;font-weight:800}
.hdr p{margin:6px 0 0;color:var(--mu);font-size:14px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px;flex:none}
.hb{display:flex;gap:8px}
main{max-width:640px;margin:auto;padding:8px 16px 24px}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;font-size:15px;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.fbtn{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px}
.fbtn.on{background:var(--ac);color:#fff}
.sort{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--mu);font-size:14px}
.sort select{border:0;background:none;font-weight:600;color:var(--tx);font-size:15px;-webkit-appearance:none;appearance:none;padding-right:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--acs);color:var(--ac);border-radius:999px;padding:6px 10px 6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.list{display:grid;gap:10px}
.card{width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.card:active{transform:scale(.985)}
.art{width:56px;height:56px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 40) 75% 48%));color:#fff;font-weight:800;letter-spacing:-.5px}
.art.t{font-size:17px}
.info{flex:1;min-width:0}
.city{font-weight:700;font-size:17.5px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mu);font-size:14px;margin-top:2px}
.sub{color:var(--mu);font-size:12.5px;margin-top:3px}
.price{text-align:right;flex:none}
.amt{font-size:22px;font-weight:800;letter-spacing:-.6px}
.amt small{font-size:12px;font-weight:600;color:var(--mu);margin-left:2px}
.tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--gns);color:var(--gn)}
.tag.r{background:var(--rds);color:var(--rd)}.tag.b{background:var(--acs);color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:48px 20px;font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 0}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:var(--ac)}
/* sheets */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}.bd.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.sheet h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px}
.sec{padding:14px 0;border-bottom:1px solid var(--ln)}.sec:last-of-type{border:0}
.sec h4{margin:0 0 10px;font-size:13px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row .lbl{font-weight:600}.row .hint{font-size:13px;color:var(--mu);font-weight:400}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;border:1.5px solid var(--ln);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.pill.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.fld input,.fld select{display:block;width:100%;height:44px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{position:relative;width:51px;height:31px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--ln);transition:.2s}.sw span:after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--gn)}.sw input:checked+span:after{transform:translateX(20px)}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;display:block;text-align:center;text-decoration:none;background:var(--ac);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.btn.g{background:var(--acs);color:var(--ac)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
/* detail screen */
.scr{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.scr.open{transform:none;visibility:visible}
.dtop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--ac);font-size:17px;font-weight:500;padding:8px 4px}
.back svg{width:22px;height:22px}
.dsc{flex:1;overflow:auto;padding:0 16px 24px;max-width:640px;width:100%;margin:auto}
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 80% 58%),hsl(calc(var(--h) + 40) 75% 42%));margin-bottom:14px;position:relative;overflow:hidden}
.hero .fl{position:absolute;right:-6px;top:-10px;font-size:96px;opacity:.28}
.hero h2{margin:0;font-size:30px;letter-spacing:-.8px}.hero p{margin:4px 0 0;opacity:.9;font-size:14.5px}
.hero .from{margin-top:14px;font-size:14px;opacity:.9}.hero .from b{font-size:26px;letter-spacing:-.6px;opacity:1;margin-left:4px}
.box{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.box h3{margin:0 0 4px;font-size:18px;letter-spacing:-.3px}.box .bs{color:var(--mu);font-size:14px;margin-bottom:10px}
.step{display:flex;gap:8px;margin-bottom:12px}
.step div{flex:1;border:1.5px solid var(--ln);border-radius:12px;padding:8px 10px}
.step div.on{border-color:var(--ac)}
.step small{display:block;font-size:12px;color:var(--mu)}.step b{font-size:15px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--mu);font-weight:600;padding:4px 0 6px;position:sticky;top:0;background:var(--card);z-index:1}
.mo{font-weight:700;font-size:16px;margin:16px 4px 6px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.day{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.day .n{font-size:15px;font-weight:600}.day .p{font-size:10.5px;color:var(--mu);font-weight:600;height:13px}
.day.c .p{color:var(--gn)}
.day:disabled{opacity:.28}
.day.in{background:var(--acs)}
.day.dep,.day.ret{background:var(--ac);color:#fff;border-radius:12px}.day.dep .p,.day.ret .p{color:#fff}
.day.dep.r1{border-radius:12px 0 0 12px}.day.ret.r1{border-radius:0 12px 12px 0}
.day.sug:after{content:"";position:absolute;inset:3px;border:2px dashed var(--gn);border-radius:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lnk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--ln);text-decoration:none;color:inherit;font-weight:600}
.lnk:first-of-type{border-top:0}.lnk span:last-child{color:var(--mu);font-weight:500;font-size:14px}
.ap{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln);font-size:15px}.ap:first-of-type{border-top:0}
.ap small{color:var(--mu)}
.dbar{background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px)}
.dbar .in{max-width:608px;margin:auto}
.dbar .sum{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.dbar .big{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1}
.dbar .dts{font-size:13.5px;color:var(--mu);margin-top:4px}
.dbar .note{font-size:13px;color:var(--mu);text-align:right;max-width:55%}
/* trips */
.tc{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.tc>*{min-width:0}.row .scroll{flex:none}
.dtitle{flex:1;text-align:center;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:36px;height:36px;border-radius:50%;background:var(--acs);color:var(--ac);font-size:20px;font-weight:700}
.tcard{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.tl{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--acs);color:var(--ac);margin-bottom:12px}
.tl.g{background:var(--gns);color:var(--gn)}
.tsum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.tsum .big{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1}.tsum small{color:var(--mu);font-size:13px}
.route{position:relative;padding-left:22px;margin:4px 0 8px}
.route:before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--ln)}
.stop{position:relative;padding:4px 0}.stop:before{content:"";position:absolute;left:-21px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--card)}
.stop b{font-size:17px}.stop span{color:var(--mu);font-size:14px;margin-left:6px}
.legx{font-size:13px;color:var(--mu);padding:2px 0 2px}
details{border-top:1px solid var(--ln);margin-top:10px;padding-top:10px}
summary{font-weight:600;color:var(--ac);list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
.br{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}.br span:first-child{color:var(--mu)}
.tip{font-size:14px;padding:5px 0 5px 18px;position:relative;line-height:1.45}.tip:before{content:"💡";position:absolute;left:-2px;font-size:12px;top:6px}
.post{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;text-decoration:none;color:inherit}
.post .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--acs)}
.post b{font-size:15.5px;line-height:1.35;display:block}.post small{color:var(--mu);font-size:13px}
.skel{height:84px;border-radius:18px;background:linear-gradient(90deg,var(--card),var(--ln),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style></head><body>
<div id="hdr" class="hdr"></div>
<main id="view"><div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
<nav class="tabbar" id="tabbar">
<button data-tab="flights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>Flights</button>
<button data-tab="trips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H12"/></svg>Trips</button>
<button data-tab="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.3a2.5 2.5 0 0 0 2.5 2.8z"/></svg>Deals</button>
<button data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>Saved</button>
</nav>
<div class="bd" id="bd"></div>
<div class="sheet" id="sheet"></div>
<div class="scr" id="det"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],AV='https://www.aviasales.com';
const AP={CMH:['Columbus',0],CVG:['Cincinnati',1.75],CLE:['Cleveland',2.25],DAY:['Dayton',1.2],DTW:['Detroit',3.25],PIT:['Pittsburgh',3],IND:['Indianapolis',3]};
const st={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({ur:1.25,mr:1.0,urb:0,mrb:0,prog:'ur',pm:false},st.get('cfg2',{}));
const S={tab:st.get('tab2','flights'),b:st.get('b','domestic'),sort:'cheap',nd:false,wk:false,from:'',to:'',l1:'',l2:'',bg:null,mo:'',hub:st.get('hub','all')};
const P={days:10,k:3,style:1,mo:''};
let D,saved=new Set(st.get('saved',[]));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=s=>new Date(s+'T00:00:00'),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=s=>s?dt(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const fdw=s=>s?dt(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'';
const dd=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const ago=i=>{const m=(Date.now()-new Date(i))/6e4;return m<2?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
const hm=m=>m?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m':'';
const urp=f=>Math.round(f*100/cfg.ur),mrp=f=>Math.round(f*100/cfg.mr);
const K=n=>n>=1e4?(n/1e3).toFixed(n>=1e5?0:1).replace('.0','')+'K':n.toLocaleString();
const money=n=>'$'+Math.round(n).toLocaleString();
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const flag=cc=>cc&&cc.length===2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))):'';
const art=d=>{const f=flag(d.cc||(d.bucket==='domestic'?'US':''));return `<div class="art${f?'':' t'}" style="--h:${hue(d.name)}">${f||esc((d.code||d.name).slice(0,3).toUpperCase())}</div>`};
const apName=o=>(AP[o]||[o])[0];
const today=iso(new Date());
const avLink=(o,c,dep,ret)=>`${AV}/search/${o}${dep.slice(8,10)}${dep.slice(5,7)}${c}${ret?ret.slice(8,10)+ret.slice(5,7):''}1`;
const gLink=(o,name,dep,ret)=>'https://www.google.com/travel/flights?q='+encodeURIComponent(`Flights from ${o} to ${name} on ${dep}${ret?' through '+ret:' one way'}`);
const months=()=>{const o=[],t=new Date();for(let i=0;i<12;i++){const d=new Date(t.getFullYear(),t.getMonth()+i,1);o.push([iso(d).slice(0,7),d.toLocaleDateString('en-US',{month:'short'})+(d.getMonth()===0||i===0?" '"+String(d.getFullYear()).slice(2):'')])}return o};

/* ---------- data ---------- */
function base(d){
  if(S.hub!=='cmh'||d.origin===D.origin)return d;
  const a=(d.alts||[]).find(x=>x.o===D.origin);if(!a)return null;
  return {...d,origin:a.o,extra:0,price:a.price,fare:a.fare,dep:a.dep,ret:a.ret,link:a.link,stops:a.stops,dur:a.dur,airline:a.airline||d.airline,cal:[],hist:[],prev:null};
}
function entries(d){
  const o=[],m=(d.dates||'').match(/(\d{4}-\d\d-\d\d)(?: to (\d{4}-\d\d-\d\d))?/),dep=d.dep||(m&&m[1])||'',ret=d.ret||(m&&m[2])||'';
  o.push({dep,ret,price:d.price,stops:d.stops,link:d.link,dur:d.dur});
  for(const c of d.cal||[])o.push({dep:c[0],ret:c[1],price:c[2],stops:c[3],link:c[4]?AV+c[4]:''});
  return o.filter(e=>!e.dep||e.dep>=today);
}
const dateF=()=>S.from||S.to||S.l1||S.l2||S.wk||S.mo;
function ok(e){
  if(S.nd&&e.stops)return false;
  if(dateF()&&!e.dep)return false;

function leg(a,b){const key=a.n+'|'+b.n;let L=legC.get(key);if(L)return L;
  const km=hav(a,b),isl=a.i||b.i,fast=FAST.has(a.cc)&&FAST.has(b.cc)&&km>200,uk=(a.cc==='GB')!==(b.cc==='GB');
  const g={m:'train',cost:14+.12*km+(uk?30:0),time:.5+km/(fast?110:80)},f={m:'flight',cost:40+.055*km,time:2.8+km/750};
  L=(!isl&&km<=1000&&g.cost+15*g.time<=f.cost+15*f.time)?g:f;L={...L,km:Math.round(km)};legC.set(key,L);return L}
function plan(){
  const N=P.days,k=P.k,mult=[.75,1,1.45][P.style],MAXL=6.5,byCode={},byName={};
  for(const d0 of D.deals){const d=base(d0);if(!d||d.bucket!=='international')continue;if(d.code)byCode[d.code]=d;byName[d.name.toLowerCase()]=d}
  const gw={};
  for(const c of CITY){const d=c.c.map(x=>byCode[x]).find(Boolean)||byName[c.n.toLowerCase()];if(!d)continue;
    const es=entries(d).filter(e=>e.dep&&e.ret).map(e=>({...e,nights:dd(e.dep,e.ret)})).filter(e=>e.nights>=N-3&&e.nights<=N-1&&e.nights>=2*k&&(!P.mo||e.dep.startsWith(P.mo)));
    if(es.length)gw[c.n]={d,e:es.reduce((a,b)=>b.price<a.price?b:a)}}
  const out=new Map(),seq=[];
  const evalSeq=s=>{const g=gw[s[0].n],n=g.e.nights,legs=[];for(let i=0;i<k-1;i++)legs.push(leg(s[i],s[i+1]));
    const back=leg(s[k-1],s[0]),loop=back.cost+15*back.time<60,close=loop?back:{cost:60,time:0};
    const b=Math.floor(n/k),ex=n-b*k,nights={};s.forEach(c=>nights[c.n]=b);[...s].sort((x,y)=>x.p-y.p).slice(0,ex).forEach(c=>nights[c.n]++);
    const stay=s.reduce((t,c)=>t+nights[c.n]*c.p*mult,0),inter=legs.reduce((t,l)=>t+l.cost,0)+close.cost,time=legs.reduce((t,l)=>t+l.time,0)+close.time;
    const total=g.e.price+stay+inter,score=total+18*time+legs.filter(l=>l.time>5).length*60+legs.filter(l=>l.m==='flight').length*30+s.reduce((t,c)=>t+(3-appeal(c))*70,0);
    const key=s.map(c=>c.n).sort().join('|');if(!out.has(key)||out.get(key).score>score)out.set(key,{s:[...s],legs,nights,stay,inter,time,total,score,flight:g.e,deal:g.d,loop,back,n})};
  const dfs=()=>{if(seq.length===k){evalSeq(seq);return}const last=seq[seq.length-1];for(const c of CITY){if(seq.includes(c)||leg(last,c).time>MAXL)continue;seq.push(c);dfs();seq.pop()}};
  for(const c of CITY){if(!gw[c.n])continue;seq.push(c);dfs();seq.pop()}
  const all=[...out.values()];if(!all.length)return[];
  const best=all.reduce((a,b)=>b.score<a.score?b:a),picks=[['Best overall',best,'']];
  const cheap=all.filter(r=>r!==best).sort((a,b)=>a.total-b.total)[0];if(cheap)picks.push(['Cheapest',cheap,'g']);
  const easy=all.filter(r=>!picks.some(p=>p[1]===r)).sort((a,b)=>a.time-b.time||a.score-b.score)[0];if(easy)picks.push(['Easiest travel',easy,'']);
  return picks;
}
function tripCard([label,r,cls]){
  const f=Math.max(0,r.flight.price-(r.deal.extra||0)),first=r.s[0],last=r.s[r.s.length-1],mult=[.75,1,1.45][P.style];
  let route='';r.s.forEach((c,i)=>{route+=`<div class="stop"><b>${esc(c.n)}</b><span>${r.nights[c.n]} night${r.nights[c.n]>1?'s':''}</span></div>`;if(i<r.legs.length){const l=r.legs[i];route+=`<div class="legx">${l.m==='train'?'🚆 Train or bus':'✈️ Short flight'} · ~${l.time.toFixed(1)}h · ~${money(l.cost)}</div>`}});
  const hi=[...r.s].sort((a,b)=>b.p-a.p)[0],lo=[...r.s].sort((a,b)=>a.p-b.p)[0],tips=[];
  if(hi!==lo&&hi.p-lo.p>=30)tips.push(`${hi.n} runs about ${money(hi.p*mult)}/day vs ${money(lo.p*mult)} in ${lo.n}. Shifting a night saves ~${money((hi.p-lo.p)*mult)}.`);
  if(r.legs.some(l=>l.m==='train'))tips.push('Book trains and buses 2+ weeks ahead and travel midweek for the lowest fares.');
  if(r.legs.some(l=>l.m==='flight'))tips.push('Budget airlines charge for bags. Travel carry-on only to stay near the estimate.');
  tips.push(r.loop?`Loop route: you end back in ${first.n} and fly home from there.`:`Open-jaw: fly into ${first.n}, home from ${last.n}. Search it as a multi-city ticket (~$60 extra assumed).`);
  if(r.deal.origin!==D.origin)tips.push(`This fare leaves from ${apName(r.deal.origin)}, about ${AP[r.deal.origin][1]}h away. The drive cost is included.`);
  return `<div class="tcard"><span class="tl ${cls}">${label}</span>
<div class="tsum"><div><small>Est. total per person</small><div class="big">${money(r.total)}</div><small>${fd(r.flight.dep)} – ${fd(r.flight.ret)} · ${r.n} nights</small></div><div style="text-align:right"><small>Flight</small><div style="font-weight:700;font-size:18px">${money(r.flight.price)}</div><small>from ${r.deal.origin}</small></div></div>
<div class="route">${route}</div>
<details><summary>Cost breakdown & tips</summary>
<div class="br"><span>Flight ${r.deal.origin} ⇄ ${esc(first.n)}</span><span>${money(r.flight.price)} (≈ ${K(urp(f))} UR)</span></div>
<div class="br"><span>Getting between cities</span><span>~${money(r.inter-(r.loop?r.back.cost:60))}</span></div>
<div class="br"><span>${r.loop?'Back to '+esc(first.n):'Open-jaw allowance'}</span><span>~${money(r.loop?r.back.cost:60)}</span></div>
<div class="br"><span>Stays, food, local transit</span><span>~${money(r.stay)}</span></div>
<div style="margin-top:8px">${tips.map(t=>`<div class="tip">${esc(t)}</div>`).join('')}</div></details>
<div class="btns"><button class="btn g" data-open="${esc(r.deal.key)}">See flight dates</button></div></div>`;
}
function trips(){
  const res=plan(),ms=months();
  $('#view').innerHTML=`<div class="tc">
<div class="row"><div class="lbl">Trip length</div><div class="stepper"><button data-act="pd-">−</button><b>${P.days} days</b><button data-act="pd+">+</button></div></div>
<div class="row"><div class="lbl">Cities</div><div class="scroll">${[2,3,4].map(n=>`<button class="pill${P.k===n?' on':''}" data-pk="${n}">${n}</button>`).join('')}</div></div>
<div><div class="lbl" style="margin-bottom:8px">Style</div><div class="scroll">${['Budget','Standard','Comfort'].map((l,i)=>`<button class="pill${P.style===i?' on':''}" data-ps="${i}">${l}</button>`).join('')}</div></div>
<div><div class="lbl" style="margin-bottom:8px">Leave in</div><div class="scroll"><button class="pill${!P.mo?' on':''}" data-pm="">Any time</button>${ms.map(([v,l])=>`<button class="pill${P.mo===v?' on':''}" data-pm="${v}">${l}</button>`).join('')}</div></div></div>
${res.length?res.map(tripCard).join(''):`<div class="empty"><b>No ${P.days}-day Europe fares saved yet</b>Try another trip length or month. New fares arrive every 6 hours.</div>`}
<p style="color:var(--mu);font-size:13px;line-height:1.5;padding:0 4px">The flight is a real saved fare. Train, bus, short-flight and daily costs are estimates, so use totals as a guide.</p>`;
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-b],[data-act],[data-clear],[data-k],[data-day],[data-mo],[data-prog],[data-pk],[data-ps],[data-pm],[data-open]');if(!t)return;
  const ds=t.dataset;
  if(ds.tab){S.tab=ds.tab;st.set('tab2',S.tab);render();scrollTo(0,0);return}
  if(ds.b){S.b=ds.b;S.bg=null;st.set('b',S.b);render();return}
  if(ds.clear){const c=ds.clear;if(c==='dates'){S.from=S.to=''}else if(c==='len'){S.l1=S.l2=''}else if(c==='bg')S.bg=null;else if(c==='hub'){S.hub='all';st.set('hub','all')}else S[c]=c==='mo'?'':false;render();return}
  if(ds.k){openDetail(ds.k);return}
  if(ds.day){pickDay(ds.day);return}
  if(ds.mo!==undefined){S.mo=ds.mo;$$('#moPills .pill').forEach(p=>p.classList.toggle('on',p.dataset.mo===S.mo));render();countN();return}
  if(ds.prog){cfg.prog=ds.prog;st.set('cfg2',cfg);$$('[data-prog]').forEach(p=>p.classList.toggle('on',p.dataset.prog===cfg.prog));render();return}
  if(ds.pk){P.k=+ds.pk;render();return}if(ds.ps!==undefined){P.style=+ds.ps;render();return}if(ds.pm!==undefined){P.mo=ds.pm;render();return}
  if(ds.open){openDetail(ds.open);return}
  const a=ds.act;
  if(a==='filters')filtersSheet();else if(a==='settings')settingsSheet();else if(a==='close')closeSheet();
  else if(a==='reset'){Object.assign(S,{from:'',to:'',l1:'',l2:'',bg:null,mo:'',wk:false,nd:false,hub:'all'});st.set('hub','all');render();filtersSheet()}
  else if(a==='refresh')load();
  else if(a==='back'){if(history.state&&history.state.d)history.back();else closeDetail()}
  else if(a==='star'){const k=C.d.key;saved.has(k)?saved.delete(k):saved.add(k);st.set('saved',[...saved]);t.textContent=saved.has(k)?'★':'☆';t.style.color=saved.has(k)?'#f59e0b':'inherit'}
  else if(a==='usebest'){C.ret=C.map[C.dep].ret;paint()}
  else if(a==='pd-'){P.days=Math.max(5,P.days-1);render()}else if(a==='pd+'){P.days=Math.min(21,P.days+1);render()}
});
$('#bd').onclick=closeSheet;
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value,c=e.target.checked;
  if(id==='sortSel'){S.sort=v;render();return}
  if(id==='fWk')S.wk=c;else if(id==='fNd')S.nd=c;else if(id==='fHub'){S.hub=c?'all':'cmh';st.set('hub',S.hub)}
  else if(id==='fFrom')S.from=v;else if(id==='fTo')S.to=v;else if(id==='fL1')S.l1=v;else if(id==='fL2')S.l2=v;
  else if(id==='sPm'){cfg.pm=c;st.set('cfg2',cfg)}
  else if(['sU','sM','sUb','sMb'].includes(id)){cfg.ur=+$('#sU').value||1.25;cfg.mr=+$('#sM').value||1;cfg.urb=+$('#sUb').value||0;cfg.mrb=+$('#sMb').value||0;st.set('cfg2',cfg)}
  else return;render();countN()});
document.addEventListener('input',e=>{if(e.target.id==='fBg'){S.bg=+e.target.value;$('#bgL').textContent=S.bg>=S.mx?'No limit':'Up to '+money(S.bg);render();countN()}});
function load(){header();
  fetch('deals.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;render();
    const h=decodeURIComponent((location.hash||'').slice(1)),dl=h&&D.deals.find(x=>x.key===h);if(dl){S.tab='flights';S.b=dl.bucket;render();openDetail(dl.key,false)}})
  .catch(()=>{$('#view').innerHTML='<div class="empty"><b>No data yet</b>Run the workflow once on GitHub, then tap ↻.</div>'})}
load();
</script></body></html>
